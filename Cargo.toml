[workspace]
# `fusekit_runtime_native` is a separate pyo3 cdylib (the dispatcher
# the runtime hook loads at decode time). The .dylib that falls out
# is then embedded into the fusekit binary at compile time via
# `include_bytes!` from runtime_payload.rs.
members = ["python_runtime"]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
# objc 0.2 expands macros containing this legacy feature probe in the
# destination crate. Declare it as an expected cfg value until metal-rs
# moves to objc2.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[package]
name = "fusekit"
version.workspace = true
edition.workspace = true
description = "Apple Metal kernel-fusion compiler and runtime for mlx-lm models"
license.workspace = true
readme = "README.md"
publish = false

[lints]
workspace = true

[[bin]]
name = "fusekit"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
dirs = "5"
comfy-table = "7"
owo-colors = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
metal = "0.29"
half = "2"
# Embedded Python interpreter for in-process graph capture. We link the
# bundled oMLX cpython-3.11 (interp-bin discovered at runtime). The
# extension-module *runtime* crate (python_runtime) uses pyo3 too but
# with the `extension-module` feature — here we want the opposite:
# fusekit is the host that embeds Python, not a module loaded by it.
pyo3 = { version = "0.22", features = ["abi3-py311"] }
objc = "0.2.7"
safetensors = "0.7.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
