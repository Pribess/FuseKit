# Point pyo3-build-config at the oMLX-bundled cpython-3.11.
# Without this, pyo3 picks up /usr/bin/python3 (macOS 3.9) and fails
# the abi3-py311 floor. Users with a different oMLX install location
# can override by exporting PYO3_PYTHON before `cargo build`.
[env]
PYO3_PYTHON = "/Applications/oMLX.app/Contents/Python/cpython-3.11/bin/python3.11"
