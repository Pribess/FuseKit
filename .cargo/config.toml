# Point pyo3-build-config at the standard oMLX-bundled CPython 3.11.
# Without this, pyo3 may pick up an older system Python and fail the
# abi3-py311 floor. For a nonstandard app location, export both
# PYO3_PYTHON and FUSEKIT_MLX_APP before invoking Cargo.
[env]
PYO3_PYTHON = "/Applications/oMLX.app/Contents/Python/cpython-3.11/bin/python3.11"
